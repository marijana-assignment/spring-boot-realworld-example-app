
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource-ro.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET_KEY}
jwt.sessionTime=86400
springdoc.swagger-ui.path=/
# spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# --- Actuator -----------------------------------------------------------------
#
# A SEPARATE PORT, AND THAT IS THE WHOLE POINT.
#
# server.servlet.context-path above is /api, and Actuator inherits the servlet
# context path when it shares the main port. Endpoints would land at
# /api/actuator/... rather than /actuator/... — so probes written against the
# documented path would 404 and the pod would never become Ready.
#
# Worse, /api is exactly what the ingress routes to this service, so every
# Actuator endpoint would be reachable from the internet through CloudFront.
# /actuator/prometheus is not sensitive in the way a secret is, but it publishes
# JVM internals, connection-pool state and every request URI the app has served.
#
# management.server.port moves Actuator to its own connector, which is not under
# the servlet context path and is not routed by any ingress. Probes and the
# ServiceMonitor target 8081; nothing outside the cluster can reach it.
management.server.port=8081

# health for the probes, prometheus for the ServiceMonitor. Nothing else is
# exposed — the default set is deliberately not widened.
management.endpoints.web.exposure.include=health,prometheus

# Splits /actuator/health into /actuator/health/liveness and /readiness. Without
# this the two probes hit the same aggregate, and a database blip that should
# only pull the pod out of the load balancer restarts the container instead.
management.endpoint.health.probes.enabled=true

# Kubernetes handles authorization for this port; there is no gateway in front
# of it to authenticate against.
management.endpoints.web.base-path=/actuator
