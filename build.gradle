plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'com.diffplug.spotless'
	id 'jacoco'
	id 'org.sonarqube'
}

group = 'io.okami101'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

// Overrides the version io.spring.dependency-management pins from the Spring
// Boot BOM. Not a preference — the CI supply-chain gate refused to ship without
// it:
//
//   org.postgresql:postgresql  CVE-2026-54291  HIGH  installed 42.7.11, fixed 42.7.12
//
// A property override rather than a version on the dependency line, because the
// driver also arrives transitively; pinning only the direct declaration would
// leave the vulnerable copy on the classpath and the scan would still fail.
//
// 42.7.13 rather than the minimum 42.7.12: it is the newest patch in the same
// line, so it costs nothing and avoids a second bump for the next advisory in
// this driver. Revisit on the next Spring Boot upgrade — a stale override that
// holds a dependency BELOW what the BOM manages is its own kind of debt.
ext['postgresql.version'] = '42.7.13'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Actuator + Micrometer. NOT optional extras here — the deployment manifests
	// in the platform repository depend on both:
	//   * readiness and liveness probes hit /actuator/health/{readiness,liveness}
	//   * the ALB target-group health check hits the readiness path
	//   * a ServiceMonitor scrapes /actuator/prometheus
	// Without these the pods never become Ready and the target group never turns
	// healthy, which presents as a 503 at the edge and says nothing about a
	// missing dependency.
	//
	// No version on either: both are managed by the Spring Boot BOM, unlike the
	// refreshVersions-managed `:_` entries below.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-common:_'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:_'
	implementation 'io.jsonwebtoken:jjwt-api:_'
	implementation 'com.github.slugify:slugify:_'
	implementation 'net.datafaker:datafaker:_'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:_'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:_'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.rest-assured:rest-assured:_'
	testImplementation 'io.rest-assured:json-path:_'
	testImplementation 'io.rest-assured:xml-path:_'
}

test {
	useJUnitPlatform()
}

jacocoTestReport {
	reports {
		xml.required.set(true)
	}
}

spotless {
	java {
		googleJavaFormat()
	}
}
